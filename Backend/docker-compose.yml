services:
  app:
    build:
      context: .
      target: production
    ports:
      - '5000:5000'
    # Docker's own json-file driver is the log source of truth (the app only
    # writes to stdout/stderr — see src/config/logger.js) — capped so
    # container logs can't fill the disk. `logging.service` is read by
    # Grafana Alloy (monitoring/alloy/config.alloy) to label this
    # container's logs `service="depot-api"`, matching what Winston already
    # writes in every log line's `service` field, even though the compose
    # service key below is `app`.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    labels:
      logging.service: depot-api
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      # The app only reads DATABASE_URL (see src/config/env.js) — DB_HOST /
      # DB_NAME / etc. are not read anywhere and were silently ignored.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/depot
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/depot
      JWT_SECRET: change-me-to-a-long-random-string
      JWT_REFRESH_SECRET: change-me-to-another-long-random-string
      JWT_ACCESS_EXPIRY: 7d
      JWT_REFRESH_EXPIRY: 30d
      JWT_ISSUER: depot-management-api
      JWT_AUDIENCE: depot-management-client
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: depot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: