services:
  app:
    build:
      context: .
      target: production
    ports:
      - '5000:5000'

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    labels:
      logging.service: depot-api
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/depot
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/depot
      JWT_SECRET: change-me-to-a-long-random-string
      JWT_REFRESH_SECRET: change-me-to-another-long-random-string
      JWT_ACCESS_EXPIRY: 7d
      JWT_REFRESH_EXPIRY: 30d
      JWT_ISSUER: depot-management-api
      JWT_AUDIENCE: depot-management-client

      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: depot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: