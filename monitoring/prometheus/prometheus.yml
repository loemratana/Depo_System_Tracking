global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Backend running on the host (npm run dev / npm start)
  - job_name: depot-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:5000"]
        labels:
          service: depot-api
          env: local

  # Production API on Render — requires METRICS_TOKEN to be set in Render's
  # env vars (see Backend/.env.example) and the same value written to
  # prometheus/secrets/metrics_token (see prometheus/secrets/README.md).
  - job_name: depot-api-render
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 20s
    authorization:
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["depo-system-tracking.onrender.com"]
        labels:
          service: depot-api
          env: production

  # Started with postgres-exporter service
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres
          env: local

  # Promtail's own health/ingestion metrics — catches the log-shipping
  # pipeline itself going quiet, not just the API.
  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]
        labels:
          service: promtail
          env: local

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: alertmanager
          env: local
