server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # JSON app logs written by Winston (Backend/logs mounted at /var/log/depot)
  - job_name: depot-api-files
    static_configs:
      - targets: [localhost]
        labels:
          job: depot-api
          service: depot-api
          __path__: /var/log/depot/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            service: service
            timestamp: timestamp
      - labels:
          level:
          service:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05.000Z"
            - "2006-01-02 15:04:05"
      - output:
          source: message

  # Optional: Docker container logs (when API runs in Docker)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/?(depot-.*|.*backend.*)"
        action: keep
      - source_labels: [__meta_docker_container_name]
        target_label: container
