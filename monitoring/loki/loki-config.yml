auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  allow_structured_metadata: true
  volume_enabled: true
  # Log retention — chunks older than this are deleted by the compactor
  # below. 30 days is a reasonable default for a single VPS; lower it (a
  # single-VPS Loki install can otherwise fill the disk, hence the
  # DiskUsageHigh alert in prometheus/alerts.yml too) by editing this value
  # and restarting Loki — no other config changes needed:
  #   retention_period: 168h   # 7 days
  #   retention_period: 336h   # 14 days
  #   retention_period: 720h   # 30 days (current)
  retention_period: 720h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  delete_request_store: filesystem
  # Actually enforces limits_config.retention_period above — without this,
  # retention_period is accepted but silently has no effect and chunks
  # accumulate forever.
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
