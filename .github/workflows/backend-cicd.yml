# Backend CI/CD: test -> build image -> push to GHCR -> deploy to the VPS.
#
# - Pull requests only run the tests.
# - Pushes to main (that touch Backend/) also build + deploy.
# - "Run workflow" (workflow_dispatch) on main does the full pipeline too.
#
# Required repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_HOST_KEY
# Optional repo variable: API_HEALTH_URL (e.g. https://depoapi.example.com/health/live)
#   — if set, the pipeline curls it after deploying.
#
# NOT handled here: database migrations. If a change adds a folder under
# Backend/prisma/migrations/, apply it to the production DB BEFORE pushing
# (e.g. from your PC: PRISMA_ENV_FILE=.env.production npx prisma migrate deploy).
#
# The VPS's docker-compose.yml backend service must use
#   image: ${BACKEND_IMAGE:-ghcr.io/<owner>/depot-backend:latest}
# instead of build:. deploy/deploy-backend.sh checks this and fails loudly.

name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - 'deploy/deploy-backend.sh'
      - '.github/workflows/backend-cicd.yml'
  pull_request:
    paths:
      - 'Backend/**'
  workflow_dispatch:

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GHCR requires a lowercase image name (an owner with capitals would break this).
  IMAGE: ghcr.io/${{ github.repository_owner }}/depot-backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Backend
    env:
      NODE_ENV: test
      # Tests mock the database/Redis; these only need to satisfy config
      # loading and `prisma generate` (run by `npm ci`'s postinstall).
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/depot_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/depot_ci?schema=public
      JWT_SECRET: ci-jwt-secret-change-me-32chars-min
      JWT_REFRESH_SECRET: ci-refresh-secret-change-me-32chars
      SESSION_SECRET: ci-session-secret
      ENABLE_ARCJET: 'false'
      ENABLE_RATE_LIMIT: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Syntax check (entry points)
        run: |
          node --check src/server.js
          node --check src/app.js

      - name: Test
        run: npm test

  build:
    name: Build & push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: ref
        run: echo "image=${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: Backend
          target: production
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ env.IMAGE }}:latest
          # Links the package to this repo so the deploy job's GITHUB_TOKEN can pull it.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    # Never run two deploys at once, and never cancel one halfway through.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          IMAGE_REF: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30"

          # Short-lived token (expires when this job ends) so the VPS can pull
          # the private image without a personal access token stored anywhere.
          $SSH "$TARGET" "docker login ghcr.io -u '$GHCR_USER' --password-stdin" <<< "$GHCR_TOKEN"

          # Stream the script from THIS commit rather than trusting a copy on the server.
          $SSH "$TARGET" "bash -s -- '$IMAGE_REF'" < deploy/deploy-backend.sh

      - name: Smoke test
        if: vars.API_HEALTH_URL != ''
        env:
          URL: ${{ vars.API_HEALTH_URL }}
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$URL"
